<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeCity · Iniciar sesión</title>
<style>
  :root{
    --bg-0:#0a0d12;--bg-1:#11161e;--bg-2:#1a2230;--line:#2a3548;--text:#e6ecf5;--text-dim:#8b97aa;
    --accent:#f4b942;--accent-2:#ff5252;--accent-3:#4dd0e1;--ok:#6bd96b;--viol:#9c6bff;
    --mono:'JetBrains Mono','SF Mono','Menlo',monospace;--display:'Space Grotesk','Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 700px at 70% -10%, #16202e 0%, var(--bg-0) 55%), var(--bg-0);
    color:var(--text);font-family:var(--mono);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .wrap{width:100%;max-width:410px}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px}
  .brand .mark{width:34px;height:34px;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-weight:700;font-family:var(--display);transform:rotate(45deg)}
  .brand .mark span{transform:rotate(-45deg)}
  .brand h1{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.5px}
  .brand h1 b{color:var(--accent);font-weight:700}
  .card{background:linear-gradient(180deg,var(--bg-1),#0c1017);border:1px solid var(--line);border-radius:14px;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .tag{text-align:center;color:var(--text-dim);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:18px;background:var(--bg-0);padding:4px;border:1px solid var(--line);border-radius:10px}
  .tabs button{background:transparent;border:0;color:var(--text-dim);font-family:var(--mono);font-size:12px;padding:9px;cursor:pointer;border-radius:7px;transition:.15s}
  .tabs button.on{background:var(--bg-2);color:var(--text)}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-size:9px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase}
  .field input{background:var(--bg-0);border:1px solid var(--line);color:var(--text);padding:11px 12px;font-family:var(--mono);font-size:13px;border-radius:8px}
  .field input:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-size:11px;color:var(--text-dim)}
  .row label{display:flex;align-items:center;gap:7px;cursor:pointer}.row input{accent-color:var(--accent)}
  .row a{color:var(--accent);text-decoration:none}
  .submit{width:100%;padding:12px;background:var(--accent);color:#1a1305;border:0;border-radius:8px;font-family:var(--mono);font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
  .submit:hover{background:#ffc857}
  .submit:disabled{opacity:.6;cursor:progress}
  .msg{margin-top:14px;font-size:11px;padding:10px 12px;border-radius:8px;display:none;line-height:1.5}
  .msg.show{display:block}
  .msg.err{background:rgba(255,82,82,.12);border:1px solid var(--accent-2);color:#ffb3b3}
  .msg.ok{background:rgba(107,217,107,.12);border:1px solid var(--ok);color:#bff0bf}
  .hint{margin-top:16px;text-align:center;font-size:10px;color:var(--text-dim);line-height:1.7}
  .hint code{color:var(--accent-3)}
  .foot{text-align:center;margin-top:18px;font-size:10px;color:var(--text-dim)}
  .foot b{color:var(--accent)}
  .backend{margin-top:12px;text-align:center;font-size:9px;letter-spacing:1px;text-transform:uppercase}
  .backend .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--text-dim);margin-right:5px;vertical-align:middle}
  .backend.local .dot{background:var(--accent)} .backend.fire .dot{background:var(--ok)}
  .google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:8px;font-family:var(--display);font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
  .google:hover{background:#f1f3f4}
  .google:disabled{opacity:.6;cursor:progress}
  .google svg{width:18px;height:18px;flex:none}
  .or{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--text-dim);font-size:10px;letter-spacing:1px;text-transform:uppercase}
  .or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<script src="firebase-config.js"></script>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark"><span>LC</span></div><h1>Life<b>City</b></h1></div>
  <div class="card">
    <div class="tag">Plataforma Urbana AEC · Cali</div>
    <div id="google-block" style="display:none">
      <button type="button" class="google" id="btn-google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continuar con Google
      </button>
      <div class="or">o con tu correo</div>
    </div>
    <div class="tabs">
      <button id="tab-login" class="on">Iniciar sesión</button>
      <button id="tab-reg">Crear cuenta</button>
    </div>
    <form id="form" autocomplete="on">
      <div class="field" id="f-name" style="display:none">
        <label>Nombre</label>
        <input type="text" id="name" placeholder="Tu nombre">
      </div>
      <div class="field">
        <label>Correo</label>
        <input type="email" id="email" placeholder="tucorreo@lifecity.com.co" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••" required minlength="6">
      </div>
      <div class="row">
        <label><input type="checkbox" id="remember" checked> Recordarme</label>
        <a href="#" id="forgot">¿Olvidaste tu contraseña?</a>
      </div>
      <button type="submit" class="submit" id="submit">Entrar a la plataforma</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="backend local" id="backend"><span class="dot"></span><span id="backend-txt">Modo local (demo)</span></div>
    <div class="hint" id="demohint">Demo: <code>demo@lifecity.com.co</code> / <code>lifecity</code></div>
  </div>
  <div class="foot">© 2026 <b>LifeCity</b> · lifecity.com.co · Life City BIM</div>
</div>

<script type="module">
// ==================== CONFIG ====================
// Autenticación REAL con Firebase (Google + correo). Configuración en firebase-config.js.
// Si firebase-config.js está vacío, funciona en MODO LOCAL (cuentas guardadas en este navegador).
const CFG = window.FIREBASE_CONFIG || {};
const SDK = window.FIREBASE_SDK || 'https://www.gstatic.com/firebasejs/10.12.2/';
const REDIRECT_AFTER_LOGIN = 'ciudades.html';
const SESSION_KEY = 'lifecity_session';
const USERS_KEY = 'lifecity_users';
const LOGOUT_FLAG = 'lifecity_logout';

const $ = (id) => document.getElementById(id);
const useFire = !!(CFG.apiKey && CFG.projectId);
let fb = null;

// ==================== HELPERS ====================
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randHex(n=16){ const a=new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function getUsers(){ try{ return JSON.parse(localStorage.getItem(USERS_KEY)||'{}'); }catch(e){ return {}; } }
function setUsers(u){ localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
async function seedDemo(){
  const users = getUsers();
  if (!users['demo@lifecity.com.co']){
    const salt = randHex();
    users['demo@lifecity.com.co'] = { name:'Demo', salt, hash: await sha256(salt+'lifecity') };
    setUsers(users);
  }
}
function setSession(email, name, extra){
  const remember = $('remember').checked;
  const exp = Date.now() + (remember ? 30*864e5 : 12*36e5); // 30 días / 12 h
  localStorage.setItem(SESSION_KEY, JSON.stringify(Object.assign({ email, name: name||email, exp }, extra||{})));
}
function show(kind, text){ const m=$('msg'); m.className='msg show '+kind; m.textContent=text; }
function go(){ setTimeout(()=> location.href = REDIRECT_AFTER_LOGIN, 400); }

const FB_ERRORS = {
  'auth/invalid-credential': 'Correo o contraseña incorrectos.',
  'auth/wrong-password': 'Contraseña incorrecta.',
  'auth/user-not-found': 'No existe una cuenta con ese correo. Crea una cuenta.',
  'auth/email-already-in-use': 'Ya existe una cuenta con ese correo. Inicia sesión (o entra con Google).',
  'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
  'auth/invalid-email': 'Correo no válido.',
  'auth/popup-closed-by-user': 'Cerraste la ventana de Google antes de terminar.',
  'auth/cancelled-popup-request': 'Cerraste la ventana de Google antes de terminar.',
  'auth/unauthorized-domain': 'Este dominio no está autorizado en Firebase (Authentication → Settings → Dominios autorizados).',
  'auth/account-exists-with-different-credential': 'Ese correo ya está registrado con otro método de acceso.',
  'auth/too-many-requests': 'Demasiados intentos. Espera un momento y vuelve a intentar.',
  'auth/network-request-failed': 'Sin conexión con Firebase. Revisa tu internet.'
};
function fbMessage(err){ return FB_ERRORS[err && err.code] || (err && err.message) || 'Error de autenticación.'; }

function enterWithUser(user){
  setSession(user.email || '', user.displayName || user.email || 'Usuario',
    { uid: user.uid, provider: 'firebase', photo: user.photoURL || '' });
  show('ok', 'Bienvenido, ' + (user.displayName || user.email) + '. Entrando…');
  go();
}

// ==================== INIT ====================
if (useFire) {
  $('backend').className = 'backend fire';
  $('backend-txt').textContent = 'Firebase Auth';
  $('demohint').style.display = 'none';
  $('google-block').style.display = 'block';
  try {
    const appMod = await import(SDK + 'firebase-app.js');
    const authMod = await import(SDK + 'firebase-auth.js');
    const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(CFG);
    fb = { m: authMod, auth: authMod.getAuth(app) };
    fb.auth.languageCode = 'es';
  } catch (e) {
    show('err', 'No se pudo cargar Firebase: ' + e.message);
  }
} else {
  seedDemo();
}

// ==================== UI TABS ====================
let mode = 'login';
function setMode(m){
  mode = m;
  $('tab-login').classList.toggle('on', m==='login');
  $('tab-reg').classList.toggle('on', m==='reg');
  $('f-name').style.display = m==='reg' ? 'flex' : 'none';
  $('submit').textContent = m==='reg' ? 'Crear cuenta y entrar' : 'Entrar a la plataforma';
  $('msg').classList.remove('show');
}
$('tab-login').onclick = ()=>setMode('login');
$('tab-reg').onclick = ()=>setMode('reg');
$('forgot').onclick = async (e)=>{
  e.preventDefault();
  if (!fb) { show('ok','Modo local: crea una cuenta nueva o usa la cuenta demo.'); return; }
  const email = $('email').value.trim().toLowerCase();
  if (!email) { show('err','Escribe tu correo arriba y vuelve a pulsar "¿Olvidaste tu contraseña?".'); return; }
  try { await fb.m.sendPasswordResetEmail(fb.auth, email); show('ok','Te enviamos un correo para restablecer la contraseña.'); }
  catch (err) { show('err', fbMessage(err)); }
};

// ==================== GOOGLE ====================
$('btn-google').onclick = async ()=>{
  if (!fb) return;
  $('btn-google').disabled = true;
  const provider = new fb.m.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    const cred = await fb.m.signInWithPopup(fb.auth, provider);
    enterWithUser(cred.user);
  } catch (err) {
    if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
      show('ok','Abriendo Google…');
      await fb.m.signInWithRedirect(fb.auth, provider);
      return;
    }
    show('err', fbMessage(err));
    $('btn-google').disabled = false;
  }
};

// ==================== SUBMIT (correo) ====================
$('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = $('email').value.trim().toLowerCase();
  const pass = $('pass').value;
  const name = $('name').value.trim();
  if (!email || pass.length < 6){ show('err','Correo válido y contraseña de 6+ caracteres.'); return; }
  $('submit').disabled = true;
  try {
    if (fb) await handleFire(email, pass, name);
    else await handleLocal(email, pass, name);
  } catch (err) {
    show('err', fb ? fbMessage(err) : (err.message || 'Error de autenticación.'));
    $('submit').disabled = false;
  }
});

async function handleLocal(email, pass, name){
  const users = getUsers();
  if (mode === 'reg'){
    if (users[email]) throw new Error('Ya existe una cuenta con ese correo. Inicia sesión.');
    const salt = randHex();
    users[email] = { name: name||email, salt, hash: await sha256(salt+pass) };
    setUsers(users);
    setSession(email, name);
    show('ok','Cuenta creada. Entrando…');
  } else {
    const u = users[email];
    if (!u) throw new Error('No existe una cuenta con ese correo. Crea una cuenta.');
    const hash = await sha256(u.salt + pass);
    if (hash !== u.hash) throw new Error('Contraseña incorrecta.');
    setSession(email, u.name);
    show('ok','Bienvenido, '+(u.name||email)+'. Entrando…');
  }
  go();
}

async function handleFire(email, pass, name){
  if (mode === 'reg'){
    const cred = await fb.m.createUserWithEmailAndPassword(fb.auth, email, pass);
    if (name) { try { await fb.m.updateProfile(cred.user, { displayName: name }); } catch (e) {} }
    enterWithUser(cred.user);
  } else {
    const cred = await fb.m.signInWithEmailAndPassword(fb.auth, email, pass);
    enterWithUser(cred.user);
  }
}

// ==================== SESIÓN EXISTENTE ====================
if (localStorage.getItem(LOGOUT_FLAG)) {
  // Venimos de "Cerrar sesión": cerrar también la sesión de Firebase y quedarse aquí.
  localStorage.removeItem(LOGOUT_FLAG);
  localStorage.removeItem(SESSION_KEY);
  if (fb) { try { await fb.m.signOut(fb.auth); } catch (e) {} }
} else if (fb) {
  try {
    const r = await fb.m.getRedirectResult(fb.auth);
    if (r && r.user) { enterWithUser(r.user); }
    else {
      const user = await new Promise(res => { const un = fb.m.onAuthStateChanged(fb.auth, u => { un(); res(u); }); });
      if (user) enterWithUser(user);
    }
  } catch (err) { show('err', fbMessage(err)); }
} else {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if (s && (!s.exp || Date.now() < s.exp)) location.replace(REDIRECT_AFTER_LOGIN);
  } catch(e){}
}
</script>
</body>
</html>
